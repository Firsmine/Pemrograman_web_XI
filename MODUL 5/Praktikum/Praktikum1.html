<html>
  <head>
    <title>Daftar Akun</title>
  </head>
  <body>
    <h1>Mendaftar Akun Baru</h1>
    <form action="">
      <fieldset>
        <legend>Bergabung dengan komunitas</legend>
        <table>
          <tr>
            <td>Nama</td>
            <td>:</td>
            <td><input type="text" name="nama" /></td>
          </tr>
          <tr>
            <td>Tempat dan Tanggal Lahir</td>
            <td>:</td>
            <td>
              <input type="text" name="tempatLahir" />
              <input type="date" name="tanggalLahir" />
            </td>
          </tr>
        </table>
      </fieldset>
    </form>
  </body>
</html>
