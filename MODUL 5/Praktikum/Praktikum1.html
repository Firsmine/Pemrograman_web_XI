<html>
  <head>
    <title>Daftar Akun</title>
  </head>
  <body>
    <h1>Mendaftar Akun Baru</h1>
    <form action="">
      <fieldset>
        <legend>Bergabung dengan komunitas</legend>
        <table>
          <tr>
            <td>Nama</td>
            <td>:</td>
            <td><input type="text" name="nama" /></td>
          </tr>
          <tr>
            <td>Tempat dan Tanggal Lahir</td>
            <td>:</td>
            <td>
              <input type="text" name="tempatLahir" />
              <input type="date" name="tanggalLahir" />
            </td>
          </tr>
          <tr>
            <td>Jenis Kelamin</td>
            <td>:</td>
            <td>
              <input type="radio" name="jk" value="pria" />Pria <br />
              <input type="radio" name="jk" value="wanita" />Wanita <br />
              <input type="radio" name="jk" value="lainnya" />Lainnya <br />
            </td>
          </tr>
          <tr>
            <td>Hobi</td>
            <td>:</td>
            <td>
              <input type="checkbox" name="hobi" value="membaca" />Membaca<br />
              <input type="checkbox" name="hobi" value="menulis" />Menulis<br />
              <input
                type="checkbox"
                name="hobi"
                value="memancing"
              />Memancing<br />
              <input
                type="checkbox"
                name="hobi"
                value="berkebun"
              />Berkebun<br />
            </td>
          </tr>
          <tr>
            <td>Kelas dan Jurusan</td>
            <td>:</td>
            <td>
              <select name="kelasJurusan">
                <option value="rpl1">XI RPL 1</option>
                <option value="rpl2">XI RPL 2</option>
                <option value="akl">XI AKL 1</option>
                <option value="akl">XI AKL 2</option>
                <option value="htl">XI HTL 1</option>
                <option value="htl">XI HTL 2</option>
                <option value="dpb">XI DPB</option>
                <option value="htl">XI TKKR</option>
                <option value="htl">XI ULW</option>
                <option value="htl">XI TKI</option>
              </select>
            </td>
          </tr>
          <tr>
            <td colspan="2"></td>
            <td><input type="submit" name="kirim" value="kirim" /></td>
          </tr>
        </table>
      </fieldset>
    </form>

    <hr />
    <h5 align="center">Copyright &copy; by Siti Shafira 2026</h5>
  </body>
</html>
