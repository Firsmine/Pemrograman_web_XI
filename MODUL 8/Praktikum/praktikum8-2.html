<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ganjil</title>
  </head>
  <body>
    <h2>Menampilkan Angka Ganjil antara 1-50</h2>
    <script>
      for (let i = 1; i <= 50; i++) {
        if ((i % 2 !== 0) & (i != 1)) {
          document.write(i + "<br>");
        }
      }
    </script>
  </body>
</html>
