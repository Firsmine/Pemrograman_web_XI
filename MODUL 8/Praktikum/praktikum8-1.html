<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Angka</title>
  </head>
  <body>
    <h2>Menampilkan Angka 1-50</h2>
    <script>
      for (let i = 1; i <= 50; i++) {
        document.write(i + "<br>");
      }
    </script>
  </body>
</html>
