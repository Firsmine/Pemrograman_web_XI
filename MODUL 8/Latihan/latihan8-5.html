<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Predikat Nilai</title>
  </head>
  <body>
    <script>
      let nilai = Number(prompt("Masukkan nilai:"));
      if (nilai >= 90) {
        document.write("Predikat: Sangat Baik");
      } else if (nilai >= 80) {
        document.write("Predikat: Baik");
      } else if (nilai >= 75) {
        document.write("Predikat: Cukup");
      } else {
        document.write("Predikat: Perlu Perbaikan");
      }
    </script>
  </body>
</html>
