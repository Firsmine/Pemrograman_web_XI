<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ganjil Genap</title>
  </head>
  <body>
    <script>
      let angka = Number(prompt("Masukkan angka: "));
      if (angka % 2 == 0) {
        document.write(angka + " adalah bilangan genap");
      } else {
        document.write(angka + " adalah bilangan ganjil");
      }
    </script>
  </body>
</html>
