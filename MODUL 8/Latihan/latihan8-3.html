<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kelulusan</title>
  </head>
  <body>
    <script>
      let nilai = Number(prompt("Masukkan nilai: "));
      if (nilai > 75) {
        document.write("Nilai : " + nilai + "<br>");
        document.write("Keterangan : Lulus");
      } else {
        document.write("Nilai : " + nilai + "<br>");
        document.write("Keterangan : Belum Lulus");
      }
    </script>
  </body>
</html>
