<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perulangan For</title>
  </head>
  <body>
    <script>
      let tampilkan = prompt("Tampilkan sebanyak : ", "");
      for (let i = 1; i <= tampilkan; i++) {
        document.write(i + "<br>");
      }
    </script>
  </body>
</html>
