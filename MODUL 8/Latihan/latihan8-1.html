<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input JavaScript</title>
  </head>
  <body>
    <h2>Input Data Siswa</h2>
    <script>
      let nama = prompt("Masukkan nama: ");
      let kelas = prompt("Masukkan kelas: ");
      let usia = Number(prompt("Masukkan usia: "));

      document.write("Nama : " + nama + "<br>");
      document.write("Kelas : " + kelas + "<br>");
      document.write("Usia : " + usia + "<br>");
    </script>
    <h5 align="center">Copyright &copy; 2026 - Fira</h5>
  </body>
</html>
