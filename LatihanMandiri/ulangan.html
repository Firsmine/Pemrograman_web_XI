<html>
  <head>
    <title>Latihan HTML Lengkap</title>
  </head>
  <body>
    <h1>Data Barang</h1>
    <table border="1" cellspacing="0" cellpadding="2" width="1000">
      <tr>
        <th rowspan="2" width="100">No</th>
        <th colspan="2" width="600">Produk</th>
        <th rowspan="2" width="300">Harga</th>
      </tr>
      <tr>
        <th width="300">Nama</th>
        <th width="300">Gambar</th>
      </tr>
      <tr height="100" align="center" valign="center">
        <td>1</td>
        <td>Laptop</td>
        <td><img src="laptop.png" alt="laptop" width="100" height="80" /></td>
        <td>Rp7.000.000</td>
      </tr>
      <tr height="100" align="center" valign="center">
        <td>2</td>
        <td>Headphone</td>
        <td>
          <img src="headphone.png" alt="headphone" width="100" height="100" />
        </td>
        <td>Rp500.000</td>
      </tr>
    </table>
  </body>
</html>
