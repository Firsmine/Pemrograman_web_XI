<html>
  <head>
    <title>Style Table</title>
    <style>
      table,
      th,
      td {
        border: 1px solid skyblue;
        border-collapse: collapse;
      }
      table {
        width: 500px;
      }
      tr:nth-child(even) {
        background-color: #ddd;
      }
    </style>
  </head>
  <body>
    <table border="1" align="center" cellspacing="0" cellpadding="5">
      <tr>
        <th width="50">No</th>
        <th width="350" colspan="2">Nama dan Alamat</th>
      </tr>
      <tr>
        <td>1</td>
        <td>John</td>
        <td>Banjarbaru</td>
      </tr>
      <tr>
        <td>2</td>
        <td>Jane</td>
        <td>Banjarmasin</td>
      </tr>
      <tr>
        <td>3</td>
        <td>Smith</td>
        <td>Banjarbaru</td>
      </tr>
      <tr>
        <td>4</td>
        <td>Mia</td>
        <td>Banjarmasin</td>
      </tr>
    </table>
    <hr />
    <h5 align="center">Copyright &copy; by Fira 2026</h5>
  </body>
</html>
