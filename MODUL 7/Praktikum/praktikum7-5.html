      document.write("Nama : " + nama + "<br>");
      document.write("Kelas : " + kelas + "<br>");
      document.write("Nilai Tugas : " + nilaiTugas + "<br>");
      document.write("Nilai Ulangan Harian : " + ulanganHarian + "<br>");
      document.write("Nilai Ujian Akhir : " + ujianAkhir + "<br>");
      document.write("Rata-Rata Nilai : " + rataRata);
